name: Build Nro

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: 'devkitpro/devkita64'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # - name: Set ownership
        # run: |
          # # this is to fix GIT not liking owner of the checkout dir
          # chown -R $(id -u):$(id -g) $PWD
          
      - name: build
        run: make -j$(nproc)

      - name: test
        run: ls -la
       
      - name: get date/date 
        env:
          TZ: "America/Chicago"
        run: | 
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV

      - name: rename nro
        run: mv nx-hbmenu.nro hbmenu.nro
        
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOW }}
          prerelease: false
          draft: false
          body: ${{ github.event.head_commit.message }}
          files: hbmenu.nro
          name: "Switch Release ${{ env.NOW }}"
